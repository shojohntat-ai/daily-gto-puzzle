<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Daily GTO Puzzle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
  
  <!-- ▼ ゲーム画面 ▼ -->
  <div id="game-screen" class="screen-layout">
    <div class="header">
      <div class="title">GTO Puzzle</div>
      <div class="level-badge" id="level-badge"></div>
    </div>

    <div class="info-bar">
      <div>📍 <span id="position-text"></span></div>
      <div>💰 Pot: <span id="pot-text" style="color: #fff; font-weight: bold;"></span></div>
      <div>🥞 Stack: <span id="stack-text"></span></div>
    </div>

    <div class="board-area">
      <div class="area-label" id="street-label"></div>
      <div class="cards-container" id="board-cards"></div>
    </div>

    <div class="hero-area">
      <div class="hero-badge" id="hero-badge"></div>
      <div class="cards-container" id="hero-cards"></div>
    </div>

    <div class="action-area" id="action-area">
      <div class="question-prompt" id="question-prompt"></div>
      
      <!-- 選択肢ボタンエリア -->
      <div class="choices" id="choices"></div>

      <!-- アクション後の即時フィードバック（ボタン選択後にフェードイン） -->
      <div id="instant-feedback" class="instant-feedback" style="display: none;">
        <div class="system-message" id="system-message"></div>
        <div class="short-explanation" id="short-explanation"></div>
        <button class="next-btn" id="next-btn" onclick="nextStep()"></button>
      </div>
    </div>
  </div>

  <!-- ▼ リザルト＆振り返り画面 ▼ -->
  <div id="result-screen" class="screen-layout" style="display: none; overflow-y: auto;">
    <h2 style="text-align: center; margin-top: 10px;">Challenge 完了！</h2>
    <div class="emoji-grid" id="emoji-grid"></div>
    <p id="total-ev" style="text-align: center; font-size: 1.2em; font-weight: bold;"></p>
    
    <button class="next-btn" style="background-color: var(--correct); margin-bottom: 30px;" onclick="shareResult()">📋 結果をコピーしてシェア</button>

    <!-- 振り返りリストエリア -->
    <div class="review-section">
      <h3 style="border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px;">👀 今日のプレイを振り返る</h3>
      <div id="review-list"></div>
    </div>
    
    <div class="premium-banner">
      <div class="premium-title">📚 さらにGTOを極めたい方へ</div>
      <div class="premium-desc">過去100問以上の厳選シチュエーションと、詳細なレンジ解析データをすべて開放。</div>
      <button class="buy-btn" onclick="alert('決済画面へ遷移 (Stripe連携予定)')">🔒 Season 1 過去問パック (¥1,000)</button>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
