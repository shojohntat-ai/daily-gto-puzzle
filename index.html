<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily GTO Puzzle</title>
  <!-- CSSファイルを読み込む -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
  <!-- ゲーム画面 -->
  <div id="game-screen">
    <div class="header">
      <h1 class="title">Daily GTO Puzzle</h1>
      <div class="level-badge" id="level-badge">🔰 初級 1/3</div>
    </div>

    <!-- 状況説明パネル -->
    <div class="context-panel">
      <div class="context-item">
        <span class="context-label">Position</span>
        <span id="position-text">Hero (BTN) vs Villain (BB)</span>
      </div>
      <div class="context-item">
        <span class="context-label">Preflop</span>
        <span id="preflop-text">Heroが2.5BBオープン、Villainがコール。</span>
      </div>
      
      <div class="table-info">
        <div>💰 Pot: <strong id="pot-text">5.5 BB</strong></div>
        <div>🥞 Eff Stack: <strong id="stack-text">97.5 BB</strong></div>
      </div>

      <div style="margin-top: 15px;">
        <span class="context-label">Board</span>
        <div class="cards-container" id="board-cards">
          <!-- JSで挿入 -->
        </div>
      </div>
      <div style="margin-top: 10px;">
        <span class="context-label" style="color: #fff; font-weight: bold;">Hero Hand</span>
        <div class="cards-container" id="hero-cards">
          <!-- JSで挿入 -->
        </div>
      </div>
    </div>

    <div class="question-prompt" id="question-prompt">
      フロップ: あなたのアクションは？
    </div>

    <div class="choices" id="choices">
      <!-- JSでボタン挿入 -->
    </div>

    <!-- 結果・解説パネル -->
    <div class="feedback-panel" id="feedback-panel">
      <div class="ev-result" id="ev-result"></div>
      <div class="explanation" id="explanation-text"></div>
      <button class="next-btn" onclick="nextQuestion()">次の問題へ</button>
    </div>
  </div>

  <!-- リザルト画面 -->
  <div id="result-screen">
    <h2>Daily Challenge 完了！</h2>
    <p style="color: var(--text-muted);">今日のあなたのGTO精度</p>
    <div class="emoji-grid" id="emoji-grid"></div>
    <p id="total-ev" style="font-size: 1.2em; font-weight: bold; margin-bottom: 30px;"></p>
    <button class="next-btn" style="background-color: var(--correct);" onclick="alert('クリップボードにコピーしました！')">結果をコピーしてシェア</button>
  </div>
</div>

<!-- JavaScriptファイルを読み込む（HTMLの読み込み完了後に実行させるため一番下に配置） -->
<script src="script.js"></script>
</body>
</html>
