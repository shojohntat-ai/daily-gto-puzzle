<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily GTO Puzzle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
  <div id="game-screen">
    <div class="header">
      <h1 class="title">Daily GTO Puzzle</h1>
      <button id="back-to-result-btn" style="display: none; background: #444; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;" onclick="backToResult()">🔙 リザルトへ戻る</button>
      <div class="level-badge" id="level-badge">🔰 初級 1/5</div>
    </div>

    <div class="context-panel">
      <div class="context-item">
        <span class="context-label">Position</span>
        <span id="position-text"></span>
      </div>
      <div class="context-item">
        <span class="context-label">Preflop</span>
        <span id="preflop-text"></span>
      </div>
      
      <div class="table-info">
        <div>💰 Pot: <strong id="pot-text"></strong></div>
        <div>🥞 Eff Stack: <strong id="stack-text"></strong></div>
      </div>

      <div style="margin-top: 15px;">
        <span class="context-label" id="street-label">Board</span>
        <div class="cards-container" id="board-cards"></div>
      </div>
      <div style="margin-top: 10px;">
        <span class="context-label" style="color: #fff; font-weight: bold;">Hero</span>
        <div class="cards-container" id="hero-cards"></div>
      </div>
    </div>

    <div class="question-prompt" id="question-prompt"></div>

    <div class="choices" id="choices"></div>

    <div class="feedback-panel" id="feedback-panel">
      <div class="ev-result" id="ev-result"></div>
      <div class="solver-bars" id="solver-bars"></div>
      
      <!-- 新設：アクションの結果（相手の行動やハンドの結末）を独立表示 -->
      <div class="action-outcome" id="action-outcome"></div>

      <!-- 既存：GTOの理論解説 -->
      <div class="explanation-box">
        <div class="explanation-title">💡 GTO解説</div>
        <div class="explanation" id="explanation-text"></div>
      </div>
      
      <div class="premium-upsell" id="premium-upsell" style="display: none;">
        <div class="premium-blur-text">詳細なレンジ分析と、このアクションが選ばれる数学的な理由...</div>
        <button class="premium-btn" onclick="alert('Google Pay / Apple Pay 決済画面へ遷移 (Stripe連携予定)')">🔒 プレミアムで詳細解説を読む</button>
      </div>

      <button class="next-btn" id="next-street-btn" onclick="nextStep()">次へ</button>
    </div>
  </div>

  <div id="result-screen">
    <h2>Daily Challenge 完了！</h2>
    <div class="emoji-grid" id="emoji-grid"></div>
    <p id="total-ev" style="font-size: 1.2em; font-weight: bold; margin-bottom: 20px;"></p>
    
    <button class="next-btn" style="background-color: #444; margin-bottom: 30px;" onclick="startReview()">👀 今日のハンドを振り返る</button>
    
    <div class="premium-banner">
      <div class="premium-title">📚 さらにGTOを極めたい方へ</div>
      <div class="premium-desc">過去100問以上の厳選シチュエーションと、ソルバーによる詳細なレンジ解析データをすべて開放します。</div>
      <button class="buy-btn" onclick="alert('Google Pay / Apple Pay 決済画面へ遷移 (Stripe連携予定)')">🔒 Season 1 過去問パックをアンロック (¥1,000)</button>
    </div>

    <button class="next-btn" style="background-color: var(--correct); margin-top: 20px;" onclick="shareResult()">結果をコピーしてシェア</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
